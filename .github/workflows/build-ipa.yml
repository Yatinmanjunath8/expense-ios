name: Build Unsigned IPA for AltStore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Inject Dynamic Build Number
        run: |
          node -e "
            const fs = require('fs');
            const file = 'app.json';
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.expo.ios.buildNumber = '${{ github.run_number }}';
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "

      - name: Generate Native iOS Project
        run: npx expo prebuild --clean --platform ios

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App
        run: |
          xcodebuild -workspace ios/ExpenseTracker.xcworkspace \
            -scheme ExpenseTracker \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY=""
            
      - name: Package into IPA
        run: |
          cd build/Build/Products/Release-iphoneos
          mkdir Payload
          cp -r ExpenseTracker.app Payload/
          zip -r ExpenseTracker.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-IPA
          path: build/Build/Products/Release-iphoneos/ExpenseTracker.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Latest Build (${{ github.sha }})
          files: build/Build/Products/Release-iphoneos/ExpenseTracker.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
